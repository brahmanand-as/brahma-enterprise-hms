<section class="auth-form"><a class="text-button" routerLink="/">← Hospital home</a><span class="eyebrow">PATIENT SELF SERVICE</span><h2>Create your patient account</h2><p class="muted">Your MRN is generated automatically. Returning patients should sign in.</p><app-notice [message]="error" kind="error" (dismiss)="error=''"></app-notice><form [formGroup]="form" (ngSubmit)="submit()"><div class="two-columns"><label>First name<input name="firstName" formControlName="firstName"><small class="field-error" *ngIf="form.controls.firstName.touched&&form.controls.firstName.invalid">First name is required.</small></label><label>Last name<input name="lastName" formControlName="lastName"></label></div><label>Mobile number<input name="mobile" formControlName="mobile" inputmode="numeric"><small class="field-error" *ngIf="form.controls.mobile.touched&&form.controls.mobile.invalid">Enter a ten-digit mobile number.</small></label><label>Username<input name="newUsername" formControlName="username"><small class="muted">3–80 letters, numbers, dots, underscores or hyphens.</small><small class="field-error" *ngIf="form.controls.username.touched&&form.controls.username.invalid">Enter a valid username. Email addresses containing @ are not accepted.</small></label><label>Password · 12 or more characters<input name="newPassword" type="password" formControlName="password" autocomplete="new-password"><small class="field-error" *ngIf="form.controls.password.touched&&form.controls.password.invalid">Use at least 12 characters.</small></label><button type="submit" class="primary full" [disabled]="busy">Create patient account</button></form><a class="text-button full" routerLink="/login">Already registered? Sign in</a></section>
